<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Docket · 钢笔 D</title>
  <style>
    :root {
      --void: #0a0a0a;
      --letter: #f6f5f2;
      --desk: #cfcbc3;
      --ink: #1c1b1a;
      --mute: #6f6b64;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
      background: var(--desk);
      color: var(--ink);
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 48px 28px 120px;
    }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
    .lead { color: var(--mute); font-size: 14px; margin: 0 0 36px; line-height: 1.65; max-width: 42em; }
    h2 { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--mute); margin: 40px 0 16px; }
    .tile { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .tile span { font-size: 12px; color: var(--mute); }
    .dock-icon { overflow: hidden; box-shadow: 0 14px 32px rgba(20, 16, 12, 0.22); }
    .dock-icon svg { display: block; }
    .sizes { display: flex; gap: 20px; align-items: flex-end; }
    .menubar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1b1b1b;
      color: #d0d0d0;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      width: fit-content;
    }
    .splash {
      background: var(--void);
      border-radius: 20px;
      padding: 56px 40px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .fake-dock {
      margin-top: 8px;
      background: rgba(255, 255, 255, 0.46);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 22px;
      padding: 10px 14px 12px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      width: fit-content;
      box-shadow: 0 18px 40px rgba(40, 30, 20, 0.12);
    }
    .ghost {
      width: 56px;
      height: 56px;
      border-radius: 13px;
      background: linear-gradient(180deg, #8a8680, #6d6a64);
      opacity: 0.55;
    }
    .compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      max-width: 420px;
    }
    @media (max-width: 640px) {
      .compare { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>钢笔 D</h1>
    <p class="lead">上一版是海报粗黑体。这版按钢笔来：下行加粗、起笔收笔是细线，略斜。还是深底留白，没有纸纹和墨点。整词写成 Docket，不是 DOCKET。</p>

    <h2>和现在比</h2>
    <div class="compare">
      <div class="tile">
        <div class="dock-icon" style="width:128px;height:128px;border-radius:28px">
          <svg viewBox="0 0 128 128" width="128" height="128" aria-hidden="true">
            <rect width="128" height="128" fill="#111" />
            <path fill="#0070F3" d="M 36 24 v 80 h 16 c 32 0 48 -16.5 48 -40 S 84 24 52 24 H 36 z" />
          </svg>
        </div>
        <span>现在 · 蓝圆肚</span>
      </div>
      <div class="tile">
        <div class="dock-icon" style="width:128px;height:128px;border-radius:28px" id="hero"></div>
        <span>钢笔 · 深底</span>
      </div>
    </div>

    <h2>尺寸</h2>
    <div class="sizes" id="sizes"></div>

    <h2>菜单栏</h2>
    <div class="menubar" id="tray"></div>

    <h2>启动画面</h2>
    <div class="splash" id="splash"></div>

    <h2>Dock 里长什么样</h2>
    <div class="fake-dock" id="fake-dock"></div>
  </main>
  <script>
    const VOID = "#0A0A0A";
    const LETTER = "#F6F5F2";

    function lerp(a, b, t) { return a + (b - a) * t; }

    function sampleCubic(p0, p1, p2, p3, n) {
      const pts = [];
      for (let i = 0; i <= n; i++) {
        const t = i / n, u = 1 - t;
        pts.push([
          u*u*u*p0[0] + 3*u*u*t*p1[0] + 3*u*t*t*p2[0] + t*t*t*p3[0],
          u*u*u*p0[1] + 3*u*u*t*p1[1] + 3*u*t*t*p2[1] + t*t*t*p3[1],
        ]);
      }
      return pts;
    }

    function sampleLine(a, b, n) {
      const pts = [];
      for (let i = 0; i <= n; i++) {
        const t = i / n;
        pts.push([lerp(a[0], b[0], t), lerp(a[1], b[1], t)]);
      }
      return pts;
    }

    function concatStrokes(parts) {
      const out = [];
      for (const p of parts) {
        if (!out.length) { out.push(...p); continue; }
        const last = out[out.length - 1];
        const next = p[0];
        if (Math.hypot(last[0] - next[0], last[1] - next[1]) < 0.2) out.push(...p.slice(1));
        else out.push(...p);
      }
      return out;
    }

    /** Pointed-pen ribbon: downstrokes swell, upstrokes hairline. */
    function ribbon(pts, thin, thick) {
      if (pts.length < 2) return { d: "", outline: [] };
      const left = [];
      const right = [];
      for (let i = 0; i < pts.length; i++) {
        const prev = pts[Math.max(0, i - 1)];
        const next = pts[Math.min(pts.length - 1, i + 1)];
        let dx = next[0] - prev[0];
        let dy = next[1] - prev[1];
        const len = Math.hypot(dx, dy) || 1;
        dx /= len; dy /= len;
        const nx = -dy, ny = dx;
        const shade = Math.max(0, Math.min(1, dy * 0.92 + 0.08));
        const w = (thin + (thick - thin) * shade) / 2;
        left.push([pts[i][0] + nx * w, pts[i][1] + ny * w]);
        right.push([pts[i][0] - nx * w, pts[i][1] - ny * w]);
      }
      const r0 = Math.hypot(left[0][0] - right[0][0], left[0][1] - right[0][1]) / 2 || thin / 2;
      const last = pts.length - 1;
      const r1 = Math.hypot(left[last][0] - right[last][0], left[last][1] - right[last][1]) / 2 || thin / 2;
      let d = `M ${left[0][0].toFixed(2)} ${left[0][1].toFixed(2)}`;
      for (let i = 1; i < left.length; i++) d += ` L ${left[i][0].toFixed(2)} ${left[i][1].toFixed(2)}`;
      d += ` A ${r1.toFixed(2)} ${r1.toFixed(2)} 0 0 1 ${right[last][0].toFixed(2)} ${right[last][1].toFixed(2)}`;
      for (let i = last - 1; i >= 0; i--) d += ` L ${right[i][0].toFixed(2)} ${right[i][1].toFixed(2)}`;
      d += ` A ${r0.toFixed(2)} ${r0.toFixed(2)} 0 0 1 ${left[0][0].toFixed(2)} ${left[0][1].toFixed(2)} Z`;
      return { d, outline: left.concat(right) };
    }

    function penGlyph(thin, thick) {
      const stem = concatStrokes([
        sampleCubic([24, 30], [28, 18], [36, 11], [44, 16], 14),
        sampleCubic([44, 16], [42, 38], [37, 64], [33, 86], 28),
      ]);
      const stemBody = sampleCubic([44, 16], [42, 38], [37, 64], [33, 86], 28);
      const bowl = concatStrokes([
        sampleCubic([48, 18], [76, 10], [94, 30], [92, 52], 24),
        sampleCubic([92, 52], [90, 74], [70, 90], [36, 86], 24),
      ]);
      const strokes = [ribbon(stem, thin, thick), ribbon(bowl, thin, thick * 0.9)];
      const core = [ribbon(stemBody, thin, thick), strokes[1]];
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const s of core) {
        for (const [x, y] of s.outline) {
          if (x < minX) minX = x;
          if (y < minY) minY = y;
          if (x > maxX) maxX = x;
          if (y > maxY) maxY = y;
        }
      }
      return {
        html: strokes.map((s) => `<path fill="${LETTER}" d="${s.d}"/>`).join(""),
        bbox: {
          minX, minY, maxX, maxY,
          cx: (minX + maxX) / 2,
          cy: (minY + maxY) / 2,
          w: maxX - minX,
          h: maxY - minY,
        },
      };
    }

    function pen(thin, thick) {
      return penGlyph(thin, thick).html;
    }

    function placedPen(size, thin, thick) {
      const { html, bbox } = penGlyph(thin, thick);
      const target = size * (size <= 20 ? 0.76 : 0.68);
      const scale = Math.min(target / bbox.w, target / bbox.h);
      const ox = size / 2 - bbox.cx * scale - size * 0.025;
      const oy = size / 2 - bbox.cy * scale + size * 0.02;
      return `<g transform="translate(${ox.toFixed(2)} ${oy.toFixed(2)}) scale(${scale.toFixed(4)})">${html}</g>`;
    }

    function wordmark(height) {
      const thin = 2.2, thick = 9.5;
      const glyphs = {
        D: { w: 78, draw: () => pen(thin, thick) },
        o: {
          w: 34,
          draw: () => {
            const loop = concatStrokes([
              sampleCubic([26, 50], [24, 36], [10, 38], [8, 56], 14),
              sampleCubic([8, 56], [6, 76], [18, 86], [28, 74], 14),
              sampleCubic([28, 74], [34, 64], [32, 52], [26, 50], 10),
            ]);
            return `<path fill="${LETTER}" d="${ribbon(loop, thin, thick * 0.62).d}"/>`;
          },
        },
        c: {
          w: 30,
          draw: () => {
            const open = concatStrokes([
              sampleCubic([26, 44], [18, 34], [6, 40], [6, 56], 12),
              sampleCubic([6, 56], [6, 78], [16, 86], [26, 78], 12),
            ]);
            return `<path fill="${LETTER}" d="${ribbon(open, thin, thick * 0.62).d}"/>`;
          },
        },
        k: {
          w: 36,
          draw: () => {
            const stem = sampleCubic([9, 16], [9, 16], [8, 58], [8, 84], 18);
            const arm = sampleCubic([9, 58], [16, 50], [26, 36], [32, 32], 12);
            const leg = sampleCubic([12, 56], [18, 64], [26, 80], [33, 84], 12);
            return [
              ribbon(stem, thin, thick * 0.82),
              ribbon(arm, thin, thick * 0.55),
              ribbon(leg, thin, thick * 0.62),
            ].map((s) => `<path fill="${LETTER}" d="${s.d}"/>`).join("");
          },
        },
        e: {
          w: 32,
          draw: () => {
            const loop = concatStrokes([
              sampleCubic([8, 58], [28, 52], [30, 40], [18, 36], 12),
              sampleCubic([18, 36], [6, 34], [4, 54], [8, 58], 10),
              sampleCubic([8, 58], [4, 74], [14, 86], [26, 80], 12),
            ]);
            return `<path fill="${LETTER}" d="${ribbon(loop, thin, thick * 0.62).d}"/>`;
          },
        },
        t: {
          w: 28,
          draw: () => {
            const stem = sampleCubic([14, 20], [14, 20], [13, 60], [16, 84], 16);
            const cross = sampleLine([4, 38], [26, 36], 8);
            return [
              ribbon(stem, thin, thick * 0.72),
              ribbon(cross, thin * 0.9, thin * 1.35),
            ].map((s) => `<path fill="${LETTER}" d="${s.d}"/>`).join("");
          },
        },
      };
      const order = ["D", "o", "c", "k", "e", "t"];
      let x = 0;
      const gap = { D: -6, o: 2, c: 4, k: 2, e: 2, t: 0 };
      const parts = [];
      for (const ch of order) {
        parts.push(`<g transform="translate(${x},0)">${glyphs[ch].draw()}</g>`);
        x += glyphs[ch].w + (gap[ch] || 0);
      }
      const scale = height / 100;
      return `<svg viewBox="0 4 ${x} 92" width="${(x * scale).toFixed(1)}" height="${(92 * scale).toFixed(1)}" aria-label="Docket">${parts.join("")}</svg>`;
    }

    function iconSvg(size, radius) {
      const r = radius ?? Math.round(size * 0.22);
      const thin = size <= 16 ? 5.5 : size <= 32 ? 4.2 : 3.2;
      const thick = size <= 16 ? 18 : size <= 32 ? 16 : 15;
      return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true">
        <rect width="${size}" height="${size}" rx="${r}" fill="${VOID}"/>
        ${placedPen(size, thin, thick)}
      </svg>`;
    }

    function traySvg(size) {
      return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true">
        ${placedPen(size, 6, 18)}
      </svg>`;
    }

    document.getElementById("hero").innerHTML = iconSvg(128, 28);

    const sizes = document.getElementById("sizes");
    for (const n of [64, 32, 16]) {
      const el = document.createElement("div");
      el.className = "tile";
      el.innerHTML = `${iconSvg(n)}<span>${n}</span>`;
      sizes.appendChild(el);
    }

    document.getElementById("tray").innerHTML = `${traySvg(16)}<span>菜单栏剪影</span><b>Docket</b>`;
    document.getElementById("splash").innerHTML = `${iconSvg(96, 22)}${wordmark(54)}`;
    document.getElementById("fake-dock").innerHTML = `
      <div class="ghost"></div>
      <div class="ghost"></div>
      <div class="dock-icon" style="width:56px;height:56px;border-radius:13px">${iconSvg(56, 13)}</div>
      <div class="ghost"></div>
      <div class="ghost"></div>
    `;
  </script>
</body>
</html>
