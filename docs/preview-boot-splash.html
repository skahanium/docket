<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Docket · 启动画面</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0a0a0a; }
    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      color: #6f6b64;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
    }
    .mark { width: 96px; height: 96px; display: block; }
    .wordmark { width: 168px; height: auto; display: block; }
    p { margin: 4px 0 0; font-size: 13px; letter-spacing: 0.06em; }
  </style>
</head>
<body>
  <div id="boot-splash">
    <img class="mark" src="../public/app-icon.svg" width="96" height="96" alt="" />
    <img class="wordmark" src="../public/wordmark.svg" width="168" alt="Docket" />
    <p>正在启动</p>
  </div>
</body>
</html>
