name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Install web dependencies
        run: npm ci

      - name: Rust tests (lib + command integration)
        working-directory: src-tauri
        run: cargo test

      - name: Frontend tests
        run: npm test

      - name: Typecheck
        run: npx tsc -b

      - name: Bindings match committed generated.ts
        run: npm run check:bindings
